<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York City and Diego Quiz</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#667085;--accent:#2563eb;--accent2:#7c3aed;--border:#dbe4f0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef4ff 0%,var(--bg) 100%);color:var(--text)}
.wrapper{max-width:820px;margin:0 auto;padding:24px 16px 40px}.hero{text-align:center;margin-bottom:18px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px;color:#123a77}.subtitle{font-size:18px;color:var(--muted);margin:0}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 30px rgba(31,41,55,.08);padding:22px}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;font-weight:700}.progress{height:12px;background:#e8eef7;border-radius:999px;overflow:hidden;margin-bottom:22px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.question{font-size:clamp(22px,4vw,30px);line-height:1.25;margin:8px 0 18px;font-weight:800}.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;border:2px solid var(--border);background:white;border-radius:14px;padding:15px 16px;font-size:18px;cursor:pointer;transition:.15s}.answer:hover{border-color:#9eb7df;background:#f8fbff}.answer:disabled{cursor:default}.answer.correct{border-color:#22c55e;background:#ecfdf3;color:#14532d;font-weight:700}.answer.wrong{border-color:#ef4444;background:#fef2f2;color:#7f1d1d}
.feedback{min-height:52px;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:17px;line-height:1.35;display:none}.feedback.ok{display:block;background:#ecfdf3;color:#14532d}.feedback.bad{display:block;background:#fef2f2;color:#7f1d1d}.controls{display:flex;justify-content:flex-end;margin-top:18px}button.next,button.restart{border:0;background:var(--accent);color:white;font-weight:700;font-size:17px;padding:13px 20px;border-radius:12px;cursor:pointer}button.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;display:none}.score{font-size:52px;font-weight:900;color:#123a77;margin:12px 0 6px}.result-text{font-size:20px;margin-bottom:18px}.review{text-align:left;margin-top:24px}.review-item{border-top:1px solid var(--border);padding:14px 0}.review-item strong{display:block;margin-bottom:6px}.small{color:var(--muted);font-size:15px}footer{text-align:center;color:var(--muted);margin-top:16px;font-size:14px}@media(max-width:560px){.quiz-card{padding:18px 14px}.answer{font-size:17px;padding:14px}}
</style></head><body><div class="wrapper"><div class="hero"><h1>New York City and Diego Quiz</h1><p class="subtitle">New York City + Me, Myself and I</p></div><div class="quiz-card"><div id="quizView"><div class="topline"><span id="counter"></span><span id="scoreLive"></span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="next" id="nextBtn" disabled>Sljedeće pitanje</button></div></div><div class="result" id="resultView"><div class="score" id="finalScore"></div><div class="result-text" id="resultText"></div><button class="restart" id="restartBtn">Pokušaj ponovno</button><div class="review" id="review"></div></div></div><footer>Kviz je bez zvuka i prilagođen učenju putem čitanja i vizualnog odabira.</footer></div>
<script>
const originalQuestions=[{"q": "Where is Diego from?", "answers": ["New York City", "Boston", "Chicago", "Philadelphia"], "correct": 0, "explanation": "Diego is from New York City."}, {"q": "Where did Diego's family originally come from?", "answers": ["Puerto Rico", "Mexico", "Spain", "Cuba"], "correct": 0, "explanation": "His family came to New York from Puerto Rico."}, {"q": "About how many people live in New York City?", "answers": ["Over 8 million", "About 2 million", "About 500,000", "Over 20 million"], "correct": 0, "explanation": "The tapescript says NYC has a population of over 8 million."}, {"q": "How many boroughs does New York City have?", "answers": ["Five", "Four", "Six", "Seven"], "correct": 0, "explanation": "The five boroughs are Manhattan, Brooklyn, Queens, the Bronx and Staten Island."}, {"q": "Which borough does Diego live in?", "answers": ["Brooklyn", "Queens", "Manhattan", "The Bronx"], "correct": 0, "explanation": "Diego lives in Brooklyn."}, {"q": "Which is the smallest borough?", "answers": ["Manhattan", "Brooklyn", "Queens", "Staten Island"], "correct": 0, "explanation": "Manhattan is the smallest borough."}, {"q": "What is Times Square famous for?", "answers": ["Neon-lit billboards and crowds", "Beaches and surfing", "Farms and forests", "Only museums"], "correct": 0, "explanation": "Times Square is known for bright billboards, shops, entertainers and people."}, {"q": "What can you see on Broadway?", "answers": ["Theatres and shows", "Airports", "Beaches", "Factories"], "correct": 0, "explanation": "Broadway is famous for its theatres and shows."}, {"q": "Where can you go shopping in Manhattan?", "answers": ["Fifth Avenue", "Hudson River", "Staten Island Ferry", "Central Park Lake"], "correct": 0, "explanation": "Fifth Avenue is famous for shopping."}, {"q": "What famous street is in the Financial District?", "answers": ["Wall Street", "Baker Street", "Oxford Street", "Abbey Road"], "correct": 0, "explanation": "Wall Street is in New York's Financial District."}, {"q": "Which food is mentioned as typical New York food?", "answers": ["Bagels", "Paella", "Fish and chips", "Tacos only"], "correct": 0, "explanation": "The tapescript mentions hot dogs, bagels, pastrami on rye and pretzels."}, {"q": "What is Smorgasburg?", "answers": ["A large weekly open-air food market", "A museum", "A theatre", "A subway station"], "correct": 0, "explanation": "Smorgasburg is NYC's largest weekly open-air food market."}, {"q": "Where can you relax in New York?", "answers": ["Central Park", "Wall Street", "Times Square", "Broadway stage"], "correct": 0, "explanation": "Central Park is New York's famous green oasis."}, {"q": "How can you see New York from a different perspective?", "answers": ["Take a helicopter tour or a ferry", "Only walk through Times Square", "Stay in a hotel room", "Take a school bus"], "correct": 0, "explanation": "The text suggests a helicopter tour or ferries on the Hudson and East Rivers."}, {"q": "What is Diego's grandmother like?", "answers": ["Wise and goofy", "Bossy and lazy", "Quiet and serious", "Dishonest and rude"], "correct": 0, "explanation": "Diego describes his grandma as very wise and also goofy."}, {"q": "What are Diego's parents like?", "answers": ["Outgoing, cheerful and hardworking", "Lazy and immature", "Moody and dishonest", "Quiet and unreliable"], "correct": 0, "explanation": "Diego says his parents are outgoing, cheerful and very hardworking."}, {"q": "What is Diego's brother passionate about?", "answers": ["Baseball", "Basketball", "Music", "Cooking"], "correct": 0, "explanation": "His brother is really passionate about baseball."}, {"q": "Why does Diego say his sister is bossy?", "answers": ["She is always telling him what to do", "She never talks to him", "She is afraid of people", "She sleeps all day"], "correct": 0, "explanation": "Diego says his sister is always telling him what to do."}, {"q": "How does Diego describe himself?", "answers": ["Chatty, helpful, caring and easy-going", "Lazy, rude and dishonest", "Very serious and silent", "Bossy and disrespectful"], "correct": 0, "explanation": "He describes himself as chatty, helpful, caring and easy-going."}, {"q": "What is one of Diego's guilty pleasures?", "answers": ["Cheesy pop music", "Reading tax reports", "Cleaning the house", "Watching the news all night"], "correct": 0, "explanation": "Diego mentions dancing to cheesy pop music as one of his guilty pleasures."}];let questions=[],index=0,score=0,answered=false,reviewData=[];
function shuffle(arr){return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function startQuiz(){questions=shuffle(originalQuestions.map(q=>{const answers=q.answers.map((text,i)=>({text,correct:i===q.correct}));return {...q,shuffled:shuffle(answers)}}));index=0;score=0;answered=false;reviewData=[];document.getElementById('quizView').style.display='block';document.getElementById('resultView').style.display='none';renderQuestion()}
function renderQuestion(){answered=false;const q=questions[index];counter.textContent=`Pitanje ${index+1} / ${questions.length}`;scoreLive.textContent=`Bodovi: ${score}`;bar.style.width=`${(index/questions.length)*100}%`;question.textContent=q.q;answers.innerHTML='';feedback.className='feedback';feedback.textContent='';nextBtn.disabled=true;q.shuffled.forEach(a=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=a.text;btn.onclick=()=>chooseAnswer(btn,a,q);answers.appendChild(btn)})}
function chooseAnswer(btn,answer,q){if(answered)return;answered=true;const buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);const correctText=q.shuffled.find(a=>a.correct).text;if(answer.correct){score++;btn.classList.add('correct')}else{btn.classList.add('wrong');buttons.forEach((b,i)=>{if(q.shuffled[i].correct)b.classList.add('correct')})}feedback.classList.add(answer.correct?'ok':'bad');feedback.innerHTML=answer.correct?`<strong>Točno!</strong> ${q.explanation||''}`:`<strong>Netočno.</strong> Točan odgovor je: <b>${correctText}</b>. ${q.explanation||''}`;reviewData.push({q:q.q,chosen:answer.text,correct:correctText,ok:answer.correct});scoreLive.textContent=`Bodovi: ${score}`;nextBtn.disabled=false}
nextBtn.onclick=()=>{if(!answered)return;index++;if(index<questions.length)renderQuestion();else showResult()};
function showResult(){quizView.style.display='none';resultView.style.display='block';const pct=Math.round(score/questions.length*100);finalScore.textContent=`${score} / ${questions.length}`;let msg=pct>=90?'Odlično! Spreman si za usmeno.':pct>=75?'Vrlo dobro! Još jednom ponovi pogreške.':pct>=60?'Dobro ide. Ponovi dijelove koje si pogriješio.':'Treba još malo vježbe. Kreni ponovno nakon kratkog ponavljanja.';resultText.textContent=`${pct}% — ${msg}`;const wrong=reviewData.filter(x=>!x.ok);review.innerHTML=!wrong.length?'<h3>Nema pogrešaka 🎉</h3>':'<h3>Ponovi ova pitanja:</h3>'+wrong.map(x=>`<div class="review-item"><strong>${x.q}</strong><div class="small">Tvoj odgovor: ${x.chosen}</div><div>Točno: <b>${x.correct}</b></div></div>`).join('')}
restartBtn.onclick=startQuiz;startQuiz();
</script></body></html>
